# Phase 2: minimal browser runtime config
default_site: mondressy

# Jenkins-portable proxy configuration. Local proxy is opt-in; CI can inject
# SHOPIFY_PROXY_SERVER / SHOPIFY_PROXY_USERNAME / SHOPIFY_PROXY_PASSWORD.
proxy:
  enabled: false
  server:
  username:
  password:
  env:
    server: SHOPIFY_PROXY_SERVER
    username: SHOPIFY_PROXY_USERNAME
    password: SHOPIFY_PROXY_PASSWORD
    enabled: SHOPIFY_PROXY_ENABLED

browsers:
  desktop:
    engine: chromium
    viewport:
      width: 1440
      height: 900

  mobile:
    engine: webkit
    device: iPhone 14
