site: lavetir
base_url: "https://www.lavetir.com"

access:
  type: signed_request
  source: env
  env:
    Signature: LAVETIR_US_SHOPIFY_SIGNATURE
    Signature-Input: LAVETIR_US_SHOPIFY_SIGNATURE_INPUT
    Signature-Agent: LAVETIR_US_SHOPIFY_SIGNATURE_AGENT
  allowed_hosts:
    - lavetir.com
    - www.lavetir.com

# Step 4B verified profile: Home and positive Search.
# Step 4C adds the GET-only Header Navigation Journey.
pages:
  home:
    url: /

    selectors:
      logo:
        by: css
        value: "h1.site-header__logo"
        stability: HIGH
        notes: Verified visible on Lavetir desktop and mobile during Step 4A probe

      search:
        desktop:
          by: css
          value: "a.js-search-header:not(.medium-up--hide)"
          stability: HIGH
          notes: Verified desktop search trigger; excludes the mobile-only duplicate
        mobile:
          by: css
          value: "a.js-search-header.medium-up--hide"
          stability: HIGH
          notes: Verified mobile search trigger; excludes the desktop-only duplicate

      cart:
        by: css
        value: "a.js-drawer-open-cart"
        stability: HIGH
        notes: Verified visible cart trigger on Lavetir desktop and mobile

  search:
    url: /search

    selectors:
      container:
        by: css
        value: ".site-header__search-container"
        stability: HIGH
        notes: Verified inline header search container; is-active marks the open state

      input:
        by: css
        value: "input#Search"
        stability: HIGH
        notes: Verified type=search name=q input on Lavetir desktop and mobile

      submit:
        by: css
        value: "button.btn--search"
        stability: HIGH
        notes: Verified search submit control; Enter and button both reach /search

      close:
        by: css
        value: "button.btn--close-search"
        stability: HIGH
        notes: Verified close control for the inline search container

      predictive_results:
        by: css
        value: "#predictive-search"
        stability: MEDIUM
        notes: Verified predictive suggestion container after filling dress

      predictive_product:
        by: css
        value: "#predictive-search a[href*='/products/']"
        stability: MEDIUM
        notes: Verified predictive product links on Lavetir desktop and mobile

      results_grid:
        by: css
        value: "#CollectionAjaxContent"
        stability: HIGH
        notes: Verified positive /search result container on Lavetir desktop and mobile

      result_card:
        by: css
        value: "#CollectionAjaxContent .grid-product"
        stability: HIGH
        notes: Verified product card scope inside the positive search result container

      result_link:
        by: css
        value: "#CollectionAjaxContent a.grid-product__link"
        stability: HIGH
        notes: Verified same-tab product links with /products/ hrefs; product is not clicked

  navigation:
    smoke_collection:
      name: Mother of the Bride Dresses
      path: /collections/mother-of-the-bride-dresses
      notes: Verified collection target in Lavetir desktop/mobile menus; GET-only navigation target

    selectors:
      header:
        by: css
        value: "header#SiteHeader"
        stability: HIGH
        notes: Verified visible site header required by HomePage.wait_core_ready

      desktop_menu:
        by: css
        value: '#SiteHeader ul.site-nav.site-navigation.horizontal-mega-menu[role="menubar"]'
        stability: HIGH
        notes: Verified Lavetir desktop navigation root for the hover journey

      desktop_menu_item:
        by: css
        value: '#SiteHeader ul.site-nav.site-navigation.horizontal-mega-menu[role="menubar"] > li.buddha-menu-item'
        stability: HIGH
        notes: Verified visible desktop top-level items

      desktop_target_parent:
        by: css
        value: 'a[href="/collections/mother-of-the-bride-dresses"][role="menuitem"].site-nav__link--underline'
        stability: HIGH
        notes: Verified visible Mother top-level link used as the desktop hover parent

      mobile_trigger:
        by: css
        value: 'button.js-drawer-open-nav[aria-controls="NavDrawer"]'
        stability: HIGH
        notes: Verified visible mobile menu trigger

      mobile_drawer:
        by: css
        value: "#NavDrawer"
        stability: HIGH
        notes: Verified Lavetir mobile navigation drawer root

      mobile_drawer_open:
        by: css
        value: "#NavDrawer.drawer--is-open"
        stability: HIGH
        notes: Verified after normal trigger click; configured drawer open-state locator

      mobile_menu:
        by: css
        value: '#NavDrawer ul.mobile-nav.mobile-nav--heading-style[role="menubar"]'
        stability: HIGH
        notes: Verified visible mobile menu root after the drawer opens

      mobile_menu_item:
        by: css
        value: '#NavDrawer ul.mobile-nav.mobile-nav--heading-style[role="menubar"] > li.buddha-menu-item'
        stability: HIGH
        notes: Verified visible mobile top-level menu items

      mobile_close:
        by: css
        value: "#NavDrawer button.drawer__close-button.js-drawer-close"
        stability: HIGH
        notes: Verified mobile drawer close control

      mobile_target_parent:
        by: css
        value: 'a[href="/collections/mother-of-the-bride-dresses"][aria-expanded] > span.toggle-menu-btn'
        stability: HIGH
        notes: Verified visible accordion toggle; the direct parent link navigates instead of expanding

      target_collection:
        by: css
        value: 'a[href="/collections/mother-of-the-bride-dresses"][role="menuitem"]:not(.site-nav__link--underline):not(.mobile-nav__link)'
        stability: HIGH
        notes: Verified child target link; excludes the visible desktop/mobile top-level entries and selects the item revealed by the configured parent interaction

  collection:
    url: /collections/mother-of-the-bride-dresses

    selectors:
      product_grid:
        by: css
        value: "#CollectionAjaxContent"
        stability: HIGH
        notes: Main Lavetir collection content root; excludes header/footer recommendation grids

      product_card:
        by: css
        value: "#CollectionAjaxContent .grid-product"
        stability: HIGH
        notes: Product cards scoped to the main collection content root

  product:
    url: /products/a-line-princess-chiffon-scoop-3-4-sleeves-mother-of-the-bride-dresses-with-appliques-ruffles-12010206a1

    color_option_control:
      strategy: associated_label

    size_resolver:
      models:
        - id: SIZE_MODEL_04
          name: LAVETIR_ASSOCIATED_LABEL_RADIO_GROUP
          group_selector: ".shopify-size-selector"
          option_selector: "input[type=\"radio\"][name=\"properties[Size]\"]"
          wait_option_selector: "input[type=\"radio\"][name=\"properties[Size]\"]"
          control_strategy: associated_label
          required_attributes: {}
          disabled_class_tokens:
            - disabled
            - sold-out
            - unavailable
          custom_size_value: Custom Size (Inch)

      custom_measurement:
        id: SIZE_MODEL_03
        name: LAVETIR_CUSTOM_MEASUREMENT_WIDGET
        trigger_value: Custom Size (Inch)
        field_selector: "input[type=\"text\"]"
        field_names:
          - Bust
          - Waist
          - Hips
          - Hollow to Floor
          - Height

    selectors:
      purchase_area:
        by: css
        value: "form.product-single__form"
        stability: HIGH
        notes: Main product purchase form

      title:
        by: css
        value: ".product-single__title"
        stability: HIGH
        notes: Product title, count=1 on verified Direct/Search/Browse PDPs

      price:
        by: css
        value: ".product__price"
        stability: HIGH
        notes: Verified readable price; selector currently matches two visible theme nodes and ProductPage uses first

      gallery:
        by: css
        value: ".product-slideshow"
        stability: MEDIUM
        notes: Main product slideshow container

      color:
        by: css
        value: ".shopify-color-selector"
        stability: HIGH
        notes: Color group with hidden radios and visible associated labels

      add_to_cart:
        by: css
        value: "form.product-single__form button[name=\"add\"]"
        stability: HIGH
        notes: Main product ATC only; scoped to product-single form and excludes recommendation/sticky buttons
